aid: fraud-net
name: Fraud.net
description: >-
  Fraud.net (FraudNet) is an enterprise fraud, risk and compliance platform used by
  payment processors, acquirers, PSPs, fintechs, banks and digital commerce platforms.
  Its Public API is a risk-decisioning surface: Check operations submit a transaction,
  order, loan application, account application or login for real-time scoring, and
  Update operations relay the eventual outcome (approved, declined, chargeback, fraud
  disposition) back so the models keep learning. Every Check returns a 0-100 risk score,
  a risk group and rule tags, drawn from supervised models, anomaly detection and a
  global anti-fraud network, alongside device fingerprinting, identity, entity screening
  and AML/KYC-adjacent compliance workflows.
