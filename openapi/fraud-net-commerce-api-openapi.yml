      - basic-auth: []
      description: 'Sends information for an eCommerce order and returns a risk score and group so that you can evaluate how to process this order.


        eCommerce orders are for products or services that your company is selling.


        **Note:** The risk group definitions are set using the Fraud.net portal.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: models.oas2.json#/definitions/schema-risk-order-request-ecommerce
