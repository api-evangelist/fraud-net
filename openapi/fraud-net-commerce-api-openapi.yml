      x-stoplight:
        id: 395e4a8yfue3c
        beforeScript: null
        afterScript: null
        public: true
        mock:
          enabled: false
          dynamic: false
          statusCode: 200
      description: 'Updates information on an order''s status.


        The status of an order can change for several reasons:


        * The overall status has changed (new order, approved, fulfilled, etc.)

        * The order has been determined to be fraudulent or not

        * The order payment status has changed (authorized, paid, declined, etc.)


        By updating an order''s status, you provide Fraud.net with important information that will be used in determining the risk score of future orders.'
