aid: fraud-net:capabilities
name: Fraud.net API Capabilities
description: >-
  Capability map for the Fraud.net public APIs covering pre-authorization
  cart validation, transaction risk scoring, post-event updates, and
  device, identity, and email risk signals.
modified: '2026-04-28'
capabilities:
  - id: cart-check
    name: Cart Check
    description: >-
      Submit a cart object with shopper, billing, shipping, line items, and
      device data prior to authorization to receive a risk score and
      decision.
    operations:
      - POST /check (Cart)
  - id: transaction-check
    name: Transaction Check
    description: >-
      Submit a transaction object including payment details and prior cart
      reference for risk evaluation and fraud decisioning.
    operations:
      - POST /check (Transaction)
  - id: update
    name: Event Update
    description: >-
      Send post-event signals (chargebacks, fulfillment confirmations, manual
      reviews, dispositions) so Fraud.net can refine future scoring.
    operations:
      - POST /update
  - id: device-intelligence
    name: Device Intelligence
    description: >-
      Provide device fingerprints, IP, geolocation, and session data to
      enrich risk decisions; works with Fraud.net's Device API SDKs.
    operations:
      - POST /device
  - id: identity-and-email-risk
    name: Identity and Email Risk
    description: >-
      Evaluate the risk of an identity or email address using Fraud.net's
      Collective Intelligence Network signals.
    operations:
      - POST /identity
      - POST /email
  - id: case-management
    name: Case Management
    description: >-
      Read and update cases generated by the platform for manual review and
      disposition workflows.
    operations:
      - GET /cases
      - PATCH /cases/{caseId}
