note: >-
  Derived from the 50 schema definitions in the provider's published contract. Fraud.net's
  model is NOT a resource graph with server-issued ids — there is no GET, no list, and no
  entity endpoint. It is a composite request document per risk event: each Check operation
  submits one nested payload assembled from shared component objects, and each Update
  operation submits a partial patch keyed on the client's own `order_id`. Relationships
  below are composition edges inside those documents, not addressable REST resources.
identity:
  primary_key: order_id
  key_owner: client
  key_note: >-
    order_id is supplied by the integrator, is the uniqueness key for duplicate detection
    (409), and is the join between a Check and every later Update. Fraud.net returns it
    unchanged as `data.id`. There are no Fraud.net-issued, prefixed object ids anywhere in
    the public contract; the only server-side handle is `data.link`, a URL to the record
    in the Case Management Portal.
  secondary_keys:
    - {field: updated_on, used_for: 'Update uniqueness — the (order_id, updated_on) pair'}
    - {field: application_id, used_for: account-application and loan-application surfaces}
    - {field: fingerprint_id, used_for: device correlation across events}
