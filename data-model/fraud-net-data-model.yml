observations:
  - >-
    Two schema namespaces coexist in one document — Models_Oas2_* and Shield_Oas2_*. The
    Shield_* set backs the identity surface (account application, login) and duplicates
    the device request object, so the identity product was clearly built on a separate
    codebase and merged into the same published contract.
  - >-
    Four definitions resolve to composition-only nodes with no own properties
    (Request-payment, Request-account, Schema-risk-order-request-ecommerce and siblings);
    their fields come entirely from allOf members.
