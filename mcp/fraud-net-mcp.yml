agent_notes:
  - Every tool is a WRITE. There is no read/list/get operation in this API at all, so an agent cannot look a record up after creating it — it can only follow `data.link` into the portal.
  - Replay protection is 409-on-duplicate keyed on order_id (and order_id + updated_on for updates). Treat a 409 as "already recorded", never as a retryable failure.
  - No reversal, cancel or delete exists. A Check cannot be withdrawn; only fields on the record can be amended by a later Update.
